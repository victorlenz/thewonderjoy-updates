# Hourly check of the GazeFix installer list (free tier: Worker + Cron Trigger + KV).
# SLACK_WEBHOOK_URL is a secret: npx wrangler secret put SLACK_WEBHOOK_URL (never put it in this file).
name = "gazefix-installer-check"
main = "src/index.mjs"
compatibility_date = "2025-09-01"

[triggers]
crons = ["0 * * * *"]

[vars]
LIST_URL = "https://updates.thewonderjoy.com/gazefix/sdk/v1/installers.json"

[[kv_namespaces]]
binding = "STATE"
id = "bcee3b3db6b5407a85a3dc4e9e9cb35b"
